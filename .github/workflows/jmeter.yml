name: JMeter Performance Tests

on:
  push:
    branches: [ main ]

jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download Apache JMeter
        run: |
          wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz && mv apache-jmeter-5.6.3 jmeter

      - name: Create test data CSV
        run: |
          mkdir -p tests
          printf 'post_id,expected_code\n1,200\n10,200\n50,200\n100,200\n999,404\n' > tests/test_data.csv

      - name: Run Performance Tests
        run: |
          rm -rf reports && mkdir -p reports results
          jmeter/bin/jmeter -n \
            -t tests/load_test.jmx \
            -l results/results.jtl \
            -e -o reports/ \
            -Jtest_data_path=tests/test_data.csv

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: reports/
